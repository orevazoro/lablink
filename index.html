<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Workspace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

<style>
:root {
    --bg: #14171c;
    --panel: #1c2027;
    --input: #252a33;
    --border: #2f3541;
    --text: #e3e7ee;
    --muted: #8b94a5;
    --accent: #3b9eff;
    --accent-hover: #2a86e0;
    --danger: #ff5c5c;
    --ok: #5ccf8a;
    --code: #9fd0ff;
}
body.light {
    --bg: #eef0f4;
    --panel: #ffffff;
    --input: #f4f6f9;
    --border: #d3d8e0;
    --text: #1d2330;
    --muted: #667085;
    --accent: #1a6fd4;
    --accent-hover: #1459aa;
    --danger: #c62828;
    --ok: #1b8a4b;
    --code: #0b4f9c;
}
* { box-sizing: border-box; }
body {
    margin: 0; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.5;
}
.app { max-width: 1100px; margin: 0 auto; }
.topbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
.status { font-size: 0.85rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dot.ok { background: var(--ok); }
.dot.bad { background: var(--danger); }

label { display: block; font-size: 0.85rem; color: var(--muted); margin: 0 0 4px; }
input[type="text"], textarea, select {
    width: 100%; padding: 10px; margin-bottom: 14px;
    background: var(--input); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    font: inherit;
}
textarea { height: 130px; resize: vertical; font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.9rem; }
input:focus-visible, textarea:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
}
button {
    padding: 9px 14px; border: 0; border-radius: 6px; cursor: pointer;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
}
button:hover { background: var(--accent-hover); }
button:disabled { opacity: 0.5; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
button.ghost:hover { background: var(--accent); color: #fff; }
button.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
button.danger:hover { background: var(--danger); color: #fff; }

.join { max-width: 420px; margin: 8vh auto 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 22px; }
.join h2 { margin: 0 0 16px; font-size: 1.1rem; }
.join button { width: 100%; }

.grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 16px; }
@media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
.col { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px; min-width: 0; }
.col h2 { margin: 0 0 10px; font-size: 0.95rem; font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.feed, .chat {
    background: var(--input); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px; overflow-y: auto; margin-bottom: 12px;
}
.feed { min-height: 240px; max-height: 420px; }
.chat { height: 300px; display: flex; flex-direction: column; gap: 6px; }

.block { position: relative; border-left: 3px solid var(--accent); background: var(--panel); border-radius: 4px; padding: 10px 12px; margin-bottom: 10px; }
.block pre { margin: 0; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
.block code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: 0.85rem; color: var(--code); }
.block .copy { position: absolute; top: 6px; right: 6px; padding: 3px 8px; font-size: 0.75rem; }
.block.file a { color: var(--accent); font-weight: 600; }

.msg { font-size: 0.9rem; word-break: break-word; }
.msg .who { font-weight: 600; color: var(--accent); margin-right: 6px; }
.msg.host .who { color: var(--ok); }
.sys { text-align: center; font-size: 0.8rem; color: var(--muted); font-style: italic; }
.typing { font-size: 0.8rem; color: var(--accent); min-height: 1.2em; margin-bottom: 6px; }
.chat-input { display: flex; gap: 8px; }
.chat-input input { margin-bottom: 0; }
.chat-input button { flex-shrink: 0; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">

    <div class="topbar">
        <h1>Lab Workspace</h1>
        <div style="display:flex; align-items:center; gap:12px;">
            <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">Not connected</span></div>
            <select id="themeSelect" style="width:auto; margin:0; padding:6px 8px;" aria-label="Theme">
                <option value="dark">Dark</option>
                <option value="light">Light</option>
            </select>
        </div>
    </div>

    <!-- JOIN -->
    <div id="joinSection" class="join">
        <h2>Join a room</h2>
        <label for="userNameInput">Your name</label>
        <input type="text" id="userNameInput" placeholder="e.g. student_01" autocomplete="off">

        <label for="roomCodeInput">Room code (also the encryption key)</label>
        <input type="text" id="roomCodeInput" placeholder="e.g. 8080" autocomplete="off">

        <label for="userRole">Role</label>
        <select id="userRole">
            <option value="member">Viewer (read-only editor, can chat)</option>
            <option value="admin">Host (can push to the editor)</option>
        </select>

        <button id="joinBtn">Join room</button>
    </div>

    <!-- MAIN -->
    <div id="mainSection" class="grid hidden">
        <div class="col">
            <h2>Shared editor <span id="roomLabel" style="font-weight:400; color:var(--muted); font-size:0.85rem;"></span></h2>

            <div id="hostPanel">
                <textarea id="hostInput" placeholder="Paste or write code to push to everyone in the room"></textarea>
                <div class="row">
                    <button id="pushBtn">Push</button>
                    <button id="fileBtn" class="ghost">Share file</button>
                    <input type="file" id="fileInput" class="hidden">
                    <button id="clearBoardBtn" class="danger">Clear editor</button>
                </div>
            </div>

            <div id="feed" class="feed"><div id="feedEmpty" class="sys">Nothing shared yet.</div></div>
            <button id="downloadBtn" class="ghost">Download editor contents</button>
        </div>

        <div class="col">
            <h2>Chat <span id="liveCount" style="font-weight:400; color:var(--ok); font-size:0.85rem;">1 online</span></h2>

            <div id="hostChatControls" class="row hidden">
                <button id="lockBtn" class="ghost">Lock chat</button>
                <button id="clearChatBtn" class="danger">Clear chat</button>
            </div>

            <div id="chat" class="chat"><div id="chatEmpty" class="sys">No messages yet.</div></div>
            <div id="typing" class="typing"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Type a message" autocomplete="off">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>
</div>

<script>
// ---------- Config ----------
const SUPABASE_URL = 'https://wrspdzaoisaqimqgkczh.supabase.co';
const SUPABASE_KEY = 'sb_publishable_LrH-_bGUQBNbG8RtFWH6EA_EndN8clA';
const MAX_FILE_BYTES = 90 * 1024;      // base64 + encryption inflates this ~1.8x, keeps messages under the Realtime size limit
const MAX_SYNC_BYTES = 180 * 1024;     // history sync message is trimmed to stay under this
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ---------- State ----------
let room = null;
let secret = '';
let role = 'member';
let myName = 'user';
const myId = 'u-' + Math.random().toString(36).slice(2, 11);
let feedLog = [];
let chatLog = [];
let chatLocked = false;
let lastTypingSent = 0;
let typingTimer = null;

const $ = (id) => document.getElementById(id);

// ---------- Theme ----------
(function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem('lab_theme'); } catch (e) {}
    if (saved === 'light') { document.body.classList.add('light'); $('themeSelect').value = 'light'; }
    $('themeSelect').addEventListener('change', (e) => {
        document.body.classList.toggle('light', e.target.value === 'light');
        try { localStorage.setItem('lab_theme', e.target.value); } catch (err) {}
    });
})();

// ---------- Status ----------
function setStatus(text, state) {
    $('statusText').textContent = text;
    $('statusDot').className = 'dot' + (state ? ' ' + state : '');
}

// ---------- Encryption ----------
function encrypt(text) { return CryptoJS.AES.encrypt(text, secret).toString(); }
function decrypt(cipher) {
    try {
        const out = CryptoJS.AES.decrypt(cipher, secret).toString(CryptoJS.enc.Utf8);
        return out || null;
    } catch (e) { return null; }
}

// ---------- Sending (reports failures instead of hiding them) ----------
async function safeSend(event, payload) {
    if (!room) return 'error';
    try {
        const res = await room.send({ type: 'broadcast', event: event, payload: payload });
        if (res !== 'ok') {
            console.warn('send failed:', event, res);
            addSystem('Not delivered (' + res + '). Check your connection.');
        }
        return res;
    } catch (e) {
        console.warn('send error:', event, e);
        addSystem('Not delivered. Check your connection.');
        return 'error';
    }
}

// ---------- Rendering ----------
function addSystem(text) {
    const el = document.createElement('div');
    el.className = 'sys';
    el.textContent = '[' + text + ']';
    const chat = $('chat');
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
}

function removeEmpty(id) { const el = $(id); if (el) el.remove(); }

function renderFeedItem(item) {
    removeEmpty('feedEmpty');
    const block = document.createElement('div');
    block.className = 'block';

    if (item.type === 'file') {
        block.classList.add('file');
        block.dataset.raw = '[file] ' + item.name;
        const name = document.createElement('div');
        name.textContent = item.name;
        name.style.fontWeight = '600';
        block.appendChild(name);
        if (typeof item.data === 'string' && item.data.indexOf('data:') === 0) {
            const a = document.createElement('a');
            a.href = item.data;
            a.download = item.name;
            a.textContent = 'Download';
            block.appendChild(a);
        }
    } else {
        block.dataset.raw = item.text;
        const pre = document.createElement('pre');
        const code = document.createElement('code');
        code.textContent = item.text;
        pre.appendChild(code);
        block.appendChild(pre);

        const copy = document.createElement('button');
        copy.className = 'copy ghost';
        copy.textContent = 'Copy';
        copy.addEventListener('click', () => {
            navigator.clipboard.writeText(item.text).then(
                () => { copy.textContent = 'Copied'; setTimeout(() => copy.textContent = 'Copy', 1200); },
                () => { copy.textContent = 'Failed'; setTimeout(() => copy.textContent = 'Copy', 1200); }
            );
        });
        block.appendChild(copy);
    }
    $('feed').prepend(block);
}

function renderChat(sender, text, senderRole) {
    removeEmpty('chatEmpty');
    const el = document.createElement('div');
    el.className = 'msg' + (senderRole === 'admin' ? ' host' : '');
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = sender;
    const body = document.createElement('span');
    body.textContent = text;
    el.appendChild(who);
    el.appendChild(body);
    const chat = $('chat');
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
}

function resetFeed(message) {
    $('feed').innerHTML = '';
    const el = document.createElement('div');
    el.id = 'feedEmpty';
    el.className = 'sys';
    el.textContent = message;
    $('feed').appendChild(el);
}
function resetChat(message) {
    $('chat').innerHTML = '';
    const el = document.createElement('div');
    el.id = 'chatEmpty';
    el.className = 'sys';
    el.textContent = message;
    $('chat').appendChild(el);
}

function updateLockUI() {
    const viewerLocked = chatLocked && role !== 'admin';
    $('chatInput').disabled = viewerLocked;
    $('sendBtn').disabled = viewerLocked;
    $('chatInput').placeholder = viewerLocked ? 'Chat is locked by the host' : 'Type a message';
    $('lockBtn').textContent = chatLocked ? 'Unlock chat' : 'Lock chat';
}

// ---------- Join ----------
function joinRoom() {
    const code = $('roomCodeInput').value.trim();
    myName = $('userNameInput').value.trim() || 'user';
    role = $('userRole').value;
    if (!code) { alert('Enter a room code.'); return; }

    secret = code;
    $('joinSection').classList.add('hidden');
    $('mainSection').classList.remove('hidden');
    $('roomLabel').textContent = '[room: ' + code + ']';
    if (role !== 'admin') $('hostPanel').classList.add('hidden');
    else $('hostChatControls').classList.remove('hidden');

    setStatus('Connecting...', '');

    room = sb.channel('workspace-' + code, {
        config: { presence: { key: myId }, broadcast: { self: false } }
    });

    room.on('broadcast', { event: 'board-update' }, ({ payload }) => {
        const raw = decrypt(payload.message);
        if (raw === null) { addSystem('Received a message that could not be decrypted. Check that the room code matches.'); return; }
        let item;
        try { item = JSON.parse(raw); } catch (e) { return; }
        renderFeedItem(item);
        if (role === 'admin') feedLog.push(item);
    });

    room.on('broadcast', { event: 'chat-message' }, ({ payload }) => {
        const text = decrypt(payload.text);
        if (text === null) { addSystem('Received a message that could not be decrypted. Check that the room code matches.'); return; }
        renderChat(payload.sender, text, payload.role);
        if (role === 'admin') chatLog.push({ sender: payload.sender, text: text, role: payload.role });
    });

    room.on('broadcast', { event: 'clear-board' }, () => {
        resetFeed('Editor cleared by host.');
        if (role === 'admin') feedLog = [];
    });

    room.on('broadcast', { event: 'clear-chat' }, () => {
        resetChat('Chat cleared by host.');
        if (role === 'admin') chatLog = [];
    });

    room.on('broadcast', { event: 'lock-chat' }, ({ payload }) => {
        chatLocked = !!payload.locked;
        updateLockUI();
    });

    room.on('broadcast', { event: 'typing' }, ({ payload }) => {
        if (payload.sender === myName) return;
        $('typing').textContent = payload.sender + ' is typing...';
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => { $('typing').textContent = ''; }, 2000);
    });

    room.on('broadcast', { event: 'sync-history' }, ({ payload }) => {
        if (role !== 'member') return;
        resetFeed('Nothing shared yet.');
        payload.feed.forEach((c) => {
            const raw = decrypt(c);
            if (raw === null) return;
            try { renderFeedItem(JSON.parse(raw)); } catch (e) {}
        });
        resetChat('No messages yet.');
        payload.chat.forEach((m) => {
            const t = decrypt(m.text);
            if (t !== null) renderChat(m.sender, t, m.role);
        });
        chatLocked = !!payload.locked;
        updateLockUI();
    });

    room.on('presence', { event: 'sync' }, () => {
        const state = room.presenceState();
        let total = 0;
        let otherHost = null;
        for (const id in state) {
            total += state[id].length;
            if (state[id][0] && state[id][0].role === 'admin' && id !== myId) otherHost = id;
        }
        $('liveCount').textContent = total + ' online';
        if (role === 'admin' && otherHost && otherHost < myId) {
            alert('This room already has a host. Reload and join as a viewer.');
            location.reload();
        }
    });

    room.on('presence', { event: 'join' }, ({ newPresences }) => {
        const p = newPresences[0];
        if (p && p.name && p.name !== myName) addSystem(p.name + ' joined');
        if (role === 'admin') sendHistory();
    });

    room.subscribe(async (status, err) => {
        console.log('realtime status:', status, err || '');
        if (status === 'SUBSCRIBED') {
            setStatus('Connected', 'ok');
            await room.track({ role: role, name: myName });
        } else if (status === 'CHANNEL_ERROR') {
            setStatus('Connection error', 'bad');
            addSystem('Connection error. The network may block realtime connections, or the server project may be paused.');
        } else if (status === 'TIMED_OUT') {
            setStatus('Timed out', 'bad');
            addSystem('Connection timed out. Try a different network.');
        } else if (status === 'CLOSED') {
            setStatus('Disconnected', 'bad');
        }
    });
}

// ---------- History sync (host only) ----------
function sendHistory() {
    let feed = feedLog.filter((i) => i.type !== 'file').slice(-15).map((i) => encrypt(JSON.stringify(i)));
    let chat = chatLog.slice(-50).map((m) => ({ sender: m.sender, role: m.role, text: encrypt(m.text) }));
    let body = { feed: feed, chat: chat, locked: chatLocked };
    while (JSON.stringify(body).length > MAX_SYNC_BYTES && (feed.length || chat.length)) {
        if (feed.length) feed.shift(); else chat.shift();
        body = { feed: feed, chat: chat, locked: chatLocked };
    }
    safeSend('sync-history', body);
}

// ---------- Host actions ----------
function pushUpdate() {
    if (role !== 'admin') return;
    const text = $('hostInput').value;
    if (!text.trim()) return;
    const item = { type: 'text', text: text };
    safeSend('board-update', { message: encrypt(JSON.stringify(item)) });
    renderFeedItem(item);
    feedLog.push(item);
    $('hostInput').value = '';
}

function shareFile(input) {
    if (role !== 'admin' || !input.files || !input.files.length) return;
    const file = input.files[0];
    if (file.size > MAX_FILE_BYTES) {
        alert('File too large. Max ' + Math.round(MAX_FILE_BYTES / 1024) + ' KB.');
        input.value = '';
        return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
        const item = { type: 'file', name: file.name, data: e.target.result };
        safeSend('board-update', { message: encrypt(JSON.stringify(item)) });
        renderFeedItem(item);
        input.value = '';
    };
    reader.readAsDataURL(file);
}

function clearBoard() {
    if (role !== 'admin') return;
    safeSend('clear-board', {});
    resetFeed('Editor cleared.');
    feedLog = [];
}

function clearChat() {
    if (role !== 'admin') return;
    safeSend('clear-chat', {});
    resetChat('Chat cleared.');
    chatLog = [];
}

function toggleLock() {
    if (role !== 'admin') return;
    chatLocked = !chatLocked;
    safeSend('lock-chat', { locked: chatLocked });
    updateLockUI();
    const note = chatLocked ? 'Chat locked by host.' : 'Chat unlocked by host.';
    safeSend('chat-message', { sender: 'host', role: 'admin', text: encrypt(note) });
    renderChat('host', note, 'admin');
}

// ---------- Chat ----------
function sendChat() {
    if (chatLocked && role !== 'admin') return;
    const input = $('chatInput');
    const text = input.value.trim();
    if (!text) return;
    safeSend('chat-message', { sender: myName, role: role, text: encrypt(text) });
    renderChat(myName, text, role);
    if (role === 'admin') chatLog.push({ sender: myName, text: text, role: role });
    input.value = '';
}

function sendTyping() {
    const now = Date.now();
    if (!room || now - lastTypingSent < 1500) return;
    lastTypingSent = now;
    room.send({ type: 'broadcast', event: 'typing', payload: { sender: myName } });
}

// ---------- Download ----------
function downloadEditor() {
    const blocks = document.querySelectorAll('#feed .block');
    let out = '';
    for (let i = blocks.length - 1; i >= 0; i--) out += blocks[i].dataset.raw + '\n\n';
    const blob = new Blob([out], { type: 'text/plain' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'editor_export.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
}

// ---------- Wire up ----------
$('joinBtn').addEventListener('click', joinRoom);
$('pushBtn').addEventListener('click', pushUpdate);
$('fileBtn').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', (e) => shareFile(e.target));
$('clearBoardBtn').addEventListener('click', clearBoard);
$('clearChatBtn').addEventListener('click', clearChat);
$('lockBtn').addEventListener('click', toggleLock);
$('sendBtn').addEventListener('click', sendChat);
$('chatInput').addEventListener('input', sendTyping);
$('chatInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChat(); });
$('downloadBtn').addEventListener('click', downloadEditor);
</script>
</body>
</html>
